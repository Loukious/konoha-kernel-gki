name: Build Kernel CI (Custom Variant)

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Custom Kernel Name (LOCALVERSION)"
        required: true
        type: string
        default: "-Kono-Ha-Kernel"
      spoof_uname:
        description: "Spoof Uname (SUSFS/Stock Naming)"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "on"
      hz:
        description: 'Refresh Rate (HZ)'
        required: true
        type: choice
        options:
          - powersave
          - balance
          - performance
          - ultra-performance
        default: ultra-performance
      variant:
        description: 'Build Variant'
        required: true
        type: choice
        options:
          - stock
          - root
          - susfs
        default: root
      root:
        description: 'Root Solution'
        required: true
        type: choice
        options:
          - ksu-next
          - ksu
          - sukisu
          - yukisu
          - resukisu
          - mambosu
        default: ksu-next
      nethunter:
        description: 'Kali NetHunter Support'
        required: true
        type: choice
        options:
          - 'off'
          - 'on'
        default: 'on'
      lto:
        description: 'LTO Type'
        required: true
        type: choice
        options:
          - thin
          - none
          - full
        default: thin
      kpm:
        description: 'Kernel Patch Module (KPM)'
        required: true
        type: choice
        options:
          - 'off'
          - 'on'
        default: 'off'
      nomount:
        description: "NoMount VFS Redirection"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      hardened:
        description: 'Hardened Kernel'
        required: true
        type: choice
        options:
          - 'off'
          - 'on'
        default: 'off'
      bypasscharging:
        description: "Bypass Charging (MCA Override)"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "on"
      droidspaces:
        description: "Droidspaces Support"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      htsr:
        description: "HTSR 240Hz Touch Sampling"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "on"
      wifi_exploit:
        description: "WiFi Performance Exploits (WLM, Coex, BBR)"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "on"
      kgsl_exploit:
        description: "KGSL GPU Bypass (LM_LIMIT, DCVS)"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "on"
      data_exploit:
        description: "Mobile Data Exploits (DFC, Powersave)"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "on"
      debug:
        description: "Debug Mode (nokaslr, no optimizations)"
        required: true
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      wlan_branch:
        description: "WLAN source branch for the nethunter vendor_dlkm module"
        required: true
        type: string
        default: "onyx-v-oss-monitor-direct"
      wlan_repo:
        description: "WLAN source repository"
        required: true
        type: string
        default: "https://github.com/Loukious/vendor_qcom_opensource_wlan.git"
      vendor_dlkm_template_url:
        description: "Base vendor_dlkm image (known-good Evolution onyx template)"
        required: true
        type: string
        default: "https://github.com/Loukious/konoha-kernel-gki/releases/download/vendor-dlkm-template-evolution-20260829/vendor_dlkm-evolution-onyx.img"
      vendor_dlkm_template_sha256:
        description: "SHA-256 of the base vendor_dlkm image"
        required: true
        type: string
        default: "897334474453521b50f31c76df095a363be97bd3f66d1f1943ede391768a186a"


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 8G
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime

jobs:
  build-custom-kernel:
    name: "Custom Build"
    runs-on: ubuntu-24.04

    steps:
      - name: Parse Inputs
        id: setup_vars
        env:
          INPUT_HZ: ${{ inputs.hz }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_ROOT: ${{ inputs.root }}
          INPUT_NETHUNTER: ${{ inputs.nethunter }}
          INPUT_KPM: ${{ inputs.kpm }}
          INPUT_NOMOUNT: ${{ inputs.nomount }}
          INPUT_HARDENED: ${{ inputs.hardened }}
          INPUT_BYPASS: ${{ inputs.bypasscharging }}
          INPUT_DROIDSPACES: ${{ inputs.droidspaces }}
          INPUT_HTSR: ${{ inputs.htsr }}
          INPUT_WIFI: ${{ inputs.wifi_exploit }}
          INPUT_KGSL: ${{ inputs.kgsl_exploit }}
          INPUT_DATA: ${{ inputs.data_exploit }}
          INPUT_DEBUG: ${{ inputs.debug }}
          INPUT_KERNEL_NAME: ${{ inputs.kernel_name }}
          INPUT_SPOOF_UNAME: ${{ inputs.spoof_uname }}
        run: |
          if [ "$INPUT_HZ" == "powersave" ]; then HZ_ID=100
          elif [ "$INPUT_HZ" == "balance" ]; then HZ_ID=250
          elif [ "$INPUT_HZ" == "performance" ]; then HZ_ID=500
          elif [ "$INPUT_HZ" == "ultra-performance" ]; then HZ_ID=1000
          fi
          echo "HZ_ID=$HZ_ID" >> $GITHUB_ENV

          ACTUAL_ROOT="$INPUT_ROOT"
          if [ "$INPUT_VARIANT" == "stock" ]; then
            ACTUAL_ROOT="none"
          fi
          echo "ACTUAL_ROOT=$ACTUAL_ROOT" >> $GITHUB_ENV

          if [ "$INPUT_VARIANT" == "stock" ]; then
            BUILD_NAME="${INPUT_VARIANT}-${INPUT_HZ}"
          else
            BUILD_NAME="${INPUT_VARIANT}-${ACTUAL_ROOT}-${INPUT_HZ}"
          fi
          
          if [ "$INPUT_KPM" == "on" ]; then 
            BUILD_NAME="${BUILD_NAME}-kpm"
          fi
          if [ "$INPUT_NOMOUNT" == "on" ]; then BUILD_NAME="${BUILD_NAME}-nomount"; fi
          if [ "$INPUT_HARDENED" == "on" ]; then BUILD_NAME="${BUILD_NAME}-hardened"; fi
          if [ "$INPUT_BYPASS" == "on" ]; then BUILD_NAME="${BUILD_NAME}-bypasscharging"; fi
          if [ "$INPUT_DROIDSPACES" == "on" ]; then BUILD_NAME="${BUILD_NAME}-droidspaces"; fi
          if [ "$INPUT_HTSR" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nohtsr"; fi
          if [ "$INPUT_WIFI" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nowifi"; fi
          if [ "$INPUT_KGSL" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nokgsl"; fi
          if [ "$INPUT_DATA" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nodata"; fi
          if [ "$INPUT_DEBUG" == "on" ]; then BUILD_NAME="${BUILD_NAME}-debug"; fi
          if [ "$INPUT_NETHUNTER" == "on" ]; then BUILD_NAME="${BUILD_NAME}-nethunter"; fi
          
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          
      - name: Rename Job
        run: echo "Mengubah nama proses untuk Build $BUILD_NAME"

      - name: Create Swap
        run: |
          SWAPFILE="/mnt/build_swapfile"
          while true; do
            if sudo fallocate -l 10G $SWAPFILE || sudo dd if=/dev/zero of=$SWAPFILE bs=1M count=10240 status=progress; then
              break
            else
              sleep 5
            fi
          done
          sudo chmod 600 $SWAPFILE && sudo mkswap $SWAPFILE && sudo swapon $SWAPFILE

      - uses: actions/checkout@v4
        with:
          path: gki-clo

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 clang lld llvm jq

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.variant }}-${{ inputs.root }}-${{ inputs.hardened }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.variant }}-${{ inputs.root }}-${{ inputs.hardened }}-
            ccache-${{ inputs.variant }}-${{ inputs.root }}-
            ccache-${{ inputs.variant }}-
            ccache-

      - name: Initialize ccache
        run: |
          ccache -z
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -o compiler_check=${{ env.CCACHE_COMPILERCHECK }}
          ccache -o sloppiness=${{ env.CCACHE_SLOPPINESS }}

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b main toolchains/clang

      - name: Setup AnyKernel3
        run: |
          cd gki-clo
          [ ! -d "anykernel" ] && git clone https://github.com/osm0sis/AnyKernel3.git anykernel || true

      - name: Setup NoMount
        if: ${{ inputs.nomount == 'on' }}
        run: |
          echo "Fetching NoMount from maxsteeel repository..."
          git clone --depth=1 https://github.com/maxsteeel/nomount.git /tmp/nomount
          cd gki-clo
          
          KERNEL_VERSION=$(grep -E '^(VERSION|PATCHLEVEL)\s*=' Makefile | awk -F'=' '{print $2}' | tr -d ' ' | paste -sd '.' -)
          echo "Detected kernel version: $KERNEL_VERSION"
          
          PATCH_FILE=$(find /tmp/nomount -type f -name "nomount_${KERNEL_VERSION}*.patch" | head -n 1)
          
          if [ -f "$PATCH_FILE" ]; then
            echo "Applying NoMount patch: $PATCH_FILE"
            patch -p1 < "$PATCH_FILE"
            
            cp -r /tmp/nomount/kernel/src/* fs/
          else
            echo "Warning: NoMount patch for $KERNEL_VERSION not found in the repository!"
            exit 1
          fi

      - name: Build Kernel
        env:
          KPM_SUPERKEY_SECRET: ${{ secrets.KPM_SUPERKEY }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_NETHUNTER: ${{ inputs.nethunter }}
          INPUT_LTO: ${{ inputs.lto }}
          INPUT_KPM: ${{ inputs.kpm }}
          INPUT_HARDENED: ${{ inputs.hardened }}
          INPUT_HTSR: ${{ inputs.htsr }}
          INPUT_WIFI: ${{ inputs.wifi_exploit }}
          INPUT_KGSL: ${{ inputs.kgsl_exploit }}
          INPUT_DATA: ${{ inputs.data_exploit }}
          INPUT_BYPASS: ${{ inputs.bypasscharging }}
          INPUT_DROIDSPACES: ${{ inputs.droidspaces }}
          INPUT_DEBUG: ${{ inputs.debug }}
          INPUT_KERNEL_NAME: ${{ inputs.kernel_name }}
          INPUT_SPOOF_UNAME: ${{ inputs.spoof_uname }}
        run: |
          # Wrap compiler with ccache
          export PATH="/usr/lib/ccache:$PATH"

          cd gki-clo
          chmod +x build.sh
          
          KPM_PATCH="on"
          if [ "$INPUT_KPM" == "on" ] && [ "$ACTUAL_ROOT" == "resukisu" ]; then
            KPM_PATCH="off"
          fi
          
          LTO_VAL="$INPUT_LTO"
          if [ "$INPUT_KPM" == "on" ]; then
            LTO_VAL="thin"
          fi
          
          KPM_KEY=""
          if [ "$INPUT_KPM" == "on" ]; then
            KPM_KEY="$KPM_SUPERKEY_SECRET"
          fi

          ./build.sh \
            hz="$HZ_ID" \
            variant="$INPUT_VARIANT" \
            root="$ACTUAL_ROOT" \
            kpm="$INPUT_KPM" \
            kpm_superkey="$KPM_KEY" \
            kpm_patch="$KPM_PATCH" \
            hardened="$INPUT_HARDENED" \
            bypasscharging="$INPUT_BYPASS" \
            droidspaces="$INPUT_DROIDSPACES" \
            nethunter="$INPUT_NETHUNTER" \
            htsr="$INPUT_HTSR" \
            wifi_exploit="$INPUT_WIFI" \
            kgsl_exploit="$INPUT_KGSL" \
            data_exploit="$INPUT_DATA" \
            debug="$INPUT_DEBUG" \
            kernel_name="$INPUT_KERNEL_NAME" \
            spoof_uname="$INPUT_SPOOF_UNAME" \
            lto="$LTO_VAL"

      - name: Show ccache stats
        if: always()
        run: ccache -s

      # ==================================================================
      # nethunter vendor_dlkm: build qca_cld3_wcn7750.ko against the
      # freshly built kernel's ABI and package it into a repacked
      # vendor_dlkm image + a recovery-flashable zip. The WLAN module in
      # the ROM's vendor_dlkm is built against the device-tree kernel, so
      # it cannot load once this kernel boots — this replaces it.
      # ==================================================================

      - name: Install vendor_dlkm build tools
        if: ${{ inputs.nethunter == 'on' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils android-sdk-libsparse-utils kmod

      - name: Clone WLAN module sources
        if: ${{ inputs.nethunter == 'on' }}
        env:
          WLAN_BRANCH: ${{ inputs.wlan_branch }}
          WLAN_REPO: ${{ inputs.wlan_repo }}
        run: |
          mkdir -p gki-clo/vendor/qcom/opensource gki-clo/sources/pixelos
          git clone --depth=1 --filter=blob:none --single-branch \
            --branch onyx-v-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            gki-clo/sources/xiaomi-kernel
          git clone --depth=1 --branch "$WLAN_BRANCH" \
            "$WLAN_REPO" \
            gki-clo/vendor/qcom/opensource/wlan
          git clone --depth=1 --branch sixteen-qpr2 \
            https://github.com/PixelOS-Devices/android_device_xiaomi_onyx-kernel.git \
            gki-clo/sources/pixelos/android_device_xiaomi_onyx-kernel
          git clone --depth=1 https://android.googlesource.com/platform/external/avb \
            gki-clo/sources/avb

          # The replacement driver must carry the monitor-mode/injection port.
          grep -q 'hdd_monitor_mode_tx_inject' \
            gki-clo/vendor/qcom/opensource/wlan/qcacld-3.0/core/hdd/src/wlan_hdd_tx_rx.c
          grep -qx 'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y' \
            gki-clo/vendor/qcom/opensource/wlan/qcacld-3.0/configs/sun_gki_wcn7750_defconfig
          test -f gki-clo/sources/xiaomi-kernel/build.config.msm.onyx
          test -f gki-clo/sources/pixelos/android_device_xiaomi_onyx-kernel/modules/vendor_dlkm/qca_cld3_wcn7750.ko

      - name: Download vendor_dlkm template and busybox
        if: ${{ inputs.nethunter == 'on' }}
        env:
          TEMPLATE_URL: ${{ inputs.vendor_dlkm_template_url }}
          TEMPLATE_SHA256: ${{ inputs.vendor_dlkm_template_sha256 }}
          BUSYBOX_URL: https://github.com/Loukious/konoha-kernel-gki/releases/download/vendor-dlkm-template-evolution-20260829/busybox-arm64-libbusybox.so
          BUSYBOX_SHA256: f213df9c0f8faa0c1f2de6d7a6f5e9c2d2f5f3bbd30f4dde38b0c05ce7dfd17c
        run: |
          mkdir -p gki-clo/sources/pixelos
          curl -fL --retry 3 "$TEMPLATE_URL" -o gki-clo/sources/pixelos/vendor_dlkm-template.img
          echo "$TEMPLATE_SHA256  gki-clo/sources/pixelos/vendor_dlkm-template.img" | sha256sum -c -
          curl -fL --retry 3 "$BUSYBOX_URL" -o gki-clo/sources/pixelos/libbusybox.so
          echo "$BUSYBOX_SHA256  gki-clo/sources/pixelos/libbusybox.so" | sha256sum -c -

          # The repack script requires an AVB vendor_dlkm descriptor on the base image.
          python3 gki-clo/sources/avb/avbtool.py info_image \
            --image gki-clo/sources/pixelos/vendor_dlkm-template.img |
            grep -E 'Partition Name:[[:space:]]*vendor_dlkm'

      - name: Prepare Onyx kernel ABI headers for the WLAN module
        if: ${{ inputs.nethunter == 'on' }}
        working-directory: gki-clo
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          clang --version | head -1

          # The module's vermagic must match the kernel built in THIS run, so
          # the ABI stamp is derived from the actual kernel release — not from
          # this branch's Makefile (upstream-bumped SUBLEVEL differs from the
          # GKI base).
          kernel_release="$(cat out/include/config/kernel.release)"
          if [[ -z "$kernel_release" ]]; then
            echo "out/include/config/kernel.release is missing — kernel build incomplete?" >&2
            exit 1
          fi
          echo "Built kernel release: $kernel_release"
          echo "WLAN_KERNEL_RELEASE=$kernel_release" >> "$GITHUB_ENV"

          abi_src="$GITHUB_WORKSPACE/gki-clo/sources/xiaomi-kernel"
          abi_out="$GITHUB_WORKSPACE/gki-clo/out-wlan"
          mkdir -p "$abi_out"

          base_version="${kernel_release%%-*}"
          if [[ "$kernel_release" == *-* ]]; then
            kernel_localversion="-${kernel_release#*-}"
          else
            kernel_localversion=""
          fi
          IFS=. read -r kernel_version kernel_patchlevel kernel_sublevel <<< "$base_version"
          if [[ -z "${kernel_version:-}" || -z "${kernel_patchlevel:-}" || -z "${kernel_sublevel:-}" ]]; then
            echo "Unexpected kernel release: $kernel_release" >&2
            exit 1
          fi
          KERNEL_VERSION="$kernel_version" \
            KERNEL_PATCHLEVEL="$kernel_patchlevel" \
            KERNEL_SUBLEVEL="$kernel_sublevel" \
            perl -0pi -e '
              s/^VERSION = .*/VERSION = $ENV{KERNEL_VERSION}/m;
              s/^PATCHLEVEL = .*/PATCHLEVEL = $ENV{KERNEL_PATCHLEVEL}/m;
              s/^SUBLEVEL = .*/SUBLEVEL = $ENV{KERNEL_SUBLEVEL}/m;
            ' "$abi_src/Makefile"

          install -D -m 0644 \
            tools/xiaomi-source-stubs/drivers/misc/hwid/Kconfig \
            "$abi_src/drivers/misc/hwid/Kconfig"
          install -D -m 0644 \
            tools/xiaomi-source-stubs/include/hwid.h \
            "$abi_src/include/hwid.h"
          rm -rf "$abi_src/drivers/power/supply/mca"
          install -D -m 0644 \
            tools/xiaomi-source-stubs/drivers/power/supply/mca/Kconfig \
            "$abi_src/drivers/power/supply/mca/Kconfig"

          vendor_perf_config="$abi_src/arch/arm64/configs/vendor/onyx_perf.config"
          KCONFIG_CONFIG="$abi_out/.config" \
            "$abi_src/scripts/kconfig/merge_config.sh" -m -r -y \
            "$abi_src/arch/arm64/configs/gki_defconfig" \
            "$abi_src/arch/arm64/configs/vendor/sun_perf.config" \
            "$vendor_perf_config"
          "$abi_src/scripts/config" --file "$abi_out/.config" \
            --set-str LOCALVERSION "$kernel_localversion" \
            --disable LOCALVERSION_AUTO \
            --disable KUNIT
          make -j"$(nproc)" -C "$abi_src" O="$abi_out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION= \
            olddefconfig prepare modules_prepare

          # Symbols/CRCs come from the kernel built in this very run.
          cp out/Module.symvers "$abi_out/Module.symvers"

          test "$(cat "$abi_out/include/config/kernel.release")" = "$kernel_release"

          # Vermagic is UTS_RELEASE plus the SMP/preempt/module flags, so the
          # ABI prep config must agree with the konoha kernel's config on
          # every flag that feeds VERMAGIC_STRING.
          for key in CONFIG_SMP CONFIG_PREEMPT CONFIG_PREEMPT_VOLUNTARY \
                     CONFIG_PREEMPT_NONE CONFIG_PREEMPT_DYNAMIC \
                     CONFIG_PREEMPT_LL CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD; do
            konoha_val="$(grep -E "^$key=|^# $key is not set" out/.config | head -1)"
            abi_val="$(grep -E "^$key=|^# $key is not set" "$abi_out/.config" | head -1)"
            if [[ "$konoha_val" != "$abi_val" ]]; then
              echo "Vermagic-affecting config differs for $key:" >&2
              echo "  konoha kernel: ${konoha_val:-unset}" >&2
              echo "  wlan ABI prep: ${abi_val:-unset}" >&2
              exit 1
            fi
          done
          echo "WLAN_KERNEL_SRC=$abi_src" >> "$GITHUB_ENV"
          echo "WLAN_KERNEL_OUT=$abi_out" >> "$GITHUB_ENV"
          echo "Prepared ABI headers for: $kernel_release"

      - name: Build WLAN module (konoha ABI, monitor + injection)
        if: ${{ inputs.nethunter == 'on' }}
        working-directory: gki-clo
        env:
          CC: clang
          KERNEL_SRC: ${{ env.WLAN_KERNEL_SRC }}
          KERNEL_OUT: ${{ env.WLAN_KERNEL_OUT }}
          KERNEL_SYMVERS: ${{ github.workspace }}/gki-clo/out/Module.symvers
          REQUIRE_INJECTION: "true"
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:/usr/lib/ccache:$PATH"
          chmod +x tools/*.sh

          tools/make_pixelos_wlan_symvers.sh artifacts/wlan/vendor-abi/pixelos-qca-extra.symvers

          module="artifacts/wlan/qca_cld3_wcn7750-nethunter-${WLAN_KERNEL_RELEASE}.ko"
          tools/build_wlan_injection_module.sh "$module"

          kernel_release="$(cat out/include/config/kernel.release)"
          module_vermagic="$(modinfo -F vermagic "$module")"
          case "$module_vermagic" in
            "$kernel_release"*) ;;
            *)
              echo "WLAN module vermagic does not match the built kernel:" >&2
              echo "  kernel release:  $kernel_release" >&2
              echo "  module vermagic: $module_vermagic" >&2
              exit 1
              ;;
          esac
          echo "module vermagic: $module_vermagic"

      - name: Build and package vendor_dlkm
        if: ${{ inputs.nethunter == 'on' }}
        working-directory: gki-clo
        run: |
          module="artifacts/wlan/qca_cld3_wcn7750-nethunter-${WLAN_KERNEL_RELEASE}.ko"
          img="Kono-Ha-Release/vendor_dlkm-onyx-nethunter-${WLAN_KERNEL_RELEASE}.img"
          zip_out="Kono-Ha-Release/Kono-Ha-vendor_dlkm-wlan-${WLAN_KERNEL_RELEASE}.zip"

          # The template's WLAN module carries the tree-kernel vermagic; the
          # replacement is built for THIS kernel, so the mismatch is expected.
          tools/make_pixelos_vendor_dlkm_img.sh \
            --stock-image sources/pixelos/vendor_dlkm-template.img \
            --wifi-ko "$module" \
            --cluster-size 4096 \
            --allow-vermagic-mismatch \
            --avbtool sources/avb/avbtool.py \
            --out "$img"

          # Verify: the repacked image really contains the new module and a
          # self-consistent AVB hashtree.
          extracted="$RUNNER_TEMP/vendor_dlkm-extracted"
          mkdir -p "$extracted"
          fsck.erofs --extract="$extracted" --no-preserve "$img"
          cmp "$module" "$extracted/lib/modules/qca_cld3_wcn7750.ko"
          verify_dir="$RUNNER_TEMP/avb-verify"
          mkdir -p "$verify_dir"
          ln -s "$PWD/$img" "$verify_dir/vendor_dlkm.img"
          (cd "$verify_dir" && python3 "$GITHUB_WORKSPACE/gki-clo/sources/avb/avbtool.py" \
            verify_image --image vendor_dlkm.img)

          tools/make_vendor_dlkm_flash_zip.sh \
            "$img" \
            sources/pixelos/libbusybox.so \
            "$zip_out" \
            "$WLAN_KERNEL_RELEASE"

          echo "## vendor_dlkm (nethunter WLAN)" >> "$GITHUB_STEP_SUMMARY"
          echo "- kernel release: ${WLAN_KERNEL_RELEASE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- module vermagic: $(modinfo -F vermagic "$module")" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$module" "$img" "$zip_out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kono-Ha-${{ env.BUILD_NAME }}
          path: gki-clo/Kono-Ha-Release
          retention-days: 7

  release:
    needs: build-custom-kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare assets
        run: |
          mkdir -p release_assets
          find artifacts -type f -name "*.zip" -exec mv {} release_assets/ \; || true
          find artifacts -type f -name "*.img" -exec mv {} release_assets/ \; || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-build-${{ github.run_number }}-${{ github.sha }}
          name: Custom Build ${{ github.sha }}
          body: |
            Automated Custom Kernel Build.
            Variant: **${{ inputs.variant }}**
            HZ: **${{ inputs.hz }}**
            Root: **${{ inputs.root }}** (if variant != stock)
            NetHunter: **${{ inputs.nethunter }}**
            LTO: **${{ inputs.lto }}**

            > When NetHunter is on, the release also carries a repacked
            > `vendor_dlkm` image + recovery-flashable zip with a
            > `qca_cld3_wcn7750.ko` rebuilt for this kernel's ABI
            > (monitor mode + packet injection). Flash it alongside the
            > kernel zip — Wi-Fi will not come up without it.
            NoMount VFS: **${{ inputs.nomount }}**
            KPM: **${{ inputs.kpm }}**
            Hardened: **${{ inputs.hardened }}**
            
            ### Performance Mods
            | Feature | Status |
            |---------|--------|
            | Bypass Charging | **${{ inputs.bypasscharging }}** |
            | Droidspaces | **${{ inputs.droidspaces }}** |
            | HTSR 240Hz Touch | **${{ inputs.htsr }}** |
            | WiFi Exploits | **${{ inputs.wifi_exploit }}** |
            | KGSL GPU Bypass | **${{ inputs.kgsl_exploit }}** |
            | Data Exploits | **${{ inputs.data_exploit }}** |
            | Debug Mode | **${{ inputs.debug }}** |
            
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref }}
          prerelease: true
          files: release_assets/*
