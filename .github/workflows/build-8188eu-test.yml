name: Build 8188eu test modules (freeze bisect)

# Builds two 8188eu driver variants against the onyx 6.6.143 kernel ABI for
# the WiFi-dongle freeze investigation:
#   A) tdwn tree (Loukious/rtl8188eus@tdwn-test18) — TDWN instrumentation +
#      test18 ablation (early-return from rtw_dev_remove; skips the entire
#      netdev/wiphy unregister teardown)
#   B) gglluukk/rtl8188eus@master — independent upstream driver, +0x8176
#      USB ID (our dongle reports 0bda:8176; upstream table lacks it)
#
# The build recipe is the one validated on-device 2026-09-13: xiaomi onyx-v-oss
# sources, stubs + gki_defconfig/sun_perf/onyx_perf merge, version stamped
# 6.6.143, Module.symvers from the konoha 6.6.143 release asset.

on:
  workflow_dispatch:
    inputs:
      module_a_repo:
        description: "Module A: tdwn repository"
        required: true
        type: string
        default: https://github.com/Loukious/rtl8188eus.git
      module_a_branch:
        description: "Module A: branch"
        required: true
        type: string
        default: tdwn-test18
      module_b_repo:
        description: "Module B: comparison repository"
        required: true
        type: string
        default: https://github.com/gglluukk/rtl8188eus.git
      module_b_branch:
        description: "Module B: branch"
        required: true
        type: string
        default: master
      kernel_release_override:
        description: "Kernel release string to stamp"
        required: true
        type: string
        default: 6.6.143
      kernel_symvers_url:
        description: "Module.symvers matching the installed kernel"
        required: true
        type: string
        default: https://github.com/Loukious/konoha-kernel-gki/releases/download/wlan-kernel-symbols/Module.symvers-6.6.143-konoha-release
      kernel_symvers_sha256_url:
        description: "SHA-256 file for Module.symvers"
        required: true
        type: string
        default: https://github.com/Loukious/konoha-kernel-gki/releases/download/wlan-kernel-symbols/Module.symvers-6.6.143-release.sha256

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: 8188eu-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 8188eu variant modules
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          path: gki-clo

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang curl flex g++-multilib \
            gcc-multilib git kmod lib32z1-dev libncurses-dev \
            libssl-dev libxml2 llvm lld python3 zip zstd

      - name: Download Neutron Clang Toolchain
        run: |
          mkdir -p toolchains/neutron-clang
          cd toolchains/neutron-clang
          bash <(curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") \
            -S=10032024 --noconfirm --noprogress --noaxel
          bash <(curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") \
            --patch=glibc --noconfirm --noprogress --noaxel
          bin/clang --version

      - name: Clone Xiaomi kernel source
        env:
          KERNEL_SOURCE_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
          KERNEL_SOURCE_BRANCH: onyx-v-oss
        run: |
          mkdir -p gki-clo/sources
          git clone --depth=1 --filter=blob:none --single-branch \
            --branch "$KERNEL_SOURCE_BRANCH" "$KERNEL_SOURCE_REPO" \
            gki-clo/sources/xiaomi-kernel
          test -f gki-clo/sources/xiaomi-kernel/build.config.msm.onyx
          test -f gki-clo/sources/xiaomi-kernel/include/linux/qcom-iommu-util.h

      - name: Download kernel symbols
        env:
          SYMVERS_URL: ${{ inputs.kernel_symvers_url }}
          SYMVERS_SHA256_URL: ${{ inputs.kernel_symvers_sha256_url }}
        run: |
          mkdir -p gki-clo/out
          curl -fL --retry 3 "$SYMVERS_URL" -o gki-clo/out/Module.symvers
          curl -fL --retry 3 "$SYMVERS_SHA256_URL" -o gki-clo/out/Module.symvers.sha256
          (cd gki-clo/out && sha256sum -c Module.symvers.sha256)

      - name: Prepare onyx kernel ABI headers (6.6.143)
        working-directory: gki-clo
        env:
          KERNEL_RELEASE_OVERRIDE: ${{ inputs.kernel_release_override }}
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/neutron-clang/bin:$PATH"

          abi_src="$GITHUB_WORKSPACE/gki-clo/sources/xiaomi-kernel"
          abi_out="$GITHUB_WORKSPACE/gki-clo/out"
          saved_symvers="$RUNNER_TEMP/saved-Module.symvers"
          kernel_device="onyx"
          vendor_perf_config="$abi_src/arch/arm64/configs/vendor/${kernel_device}_perf.config"

          cp "$abi_out/Module.symvers" "$saved_symvers"
          mkdir -p "$abi_out"
          base_version="${KERNEL_RELEASE_OVERRIDE%%-*}"
          IFS=. read -r kernel_version kernel_patchlevel kernel_sublevel <<< "$base_version"
          KERNEL_VERSION="$kernel_version" \
          KERNEL_PATCHLEVEL="$kernel_patchlevel" \
          KERNEL_SUBLEVEL="$kernel_sublevel" \
          perl -0pi -e '
            s/^VERSION = .*/VERSION = $ENV{KERNEL_VERSION}/m;
            s/^PATCHLEVEL = .*/PATCHLEVEL = $ENV{KERNEL_PATCHLEVEL}/m;
            s/^SUBLEVEL = .*/SUBLEVEL = $ENV{KERNEL_SUBLEVEL}/m;
          ' "$abi_src/Makefile"
          install -D -m 0644 \
            tools/xiaomi-source-stubs/drivers/misc/hwid/Kconfig \
            "$abi_src/drivers/misc/hwid/Kconfig"
          install -D -m 0644 \
            tools/xiaomi-source-stubs/include/hwid.h \
            "$abi_src/include/hwid.h"
          rm -rf "$abi_src/drivers/power/supply/mca"
          install -D -m 0644 \
            tools/xiaomi-source-stubs/drivers/power/supply/mca/Kconfig \
            "$abi_src/drivers/power/supply/mca/Kconfig"
          test -f "$vendor_perf_config"
          KCONFIG_CONFIG="$abi_out/.config" \
            "$abi_src/scripts/kconfig/merge_config.sh" -m -r -y \
            "$abi_src/arch/arm64/configs/gki_defconfig" \
            "$abi_src/arch/arm64/configs/vendor/sun_perf.config" \
            "$vendor_perf_config"
          "$abi_src/scripts/config" --file "$abi_out/.config" \
            --set-str LOCALVERSION "" \
            --disable LOCALVERSION_AUTO \
            --disable KUNIT
          make -j"$(nproc)" -C "$abi_src" O="$abi_out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION= \
            olddefconfig prepare modules_prepare
          cp "$saved_symvers" "$abi_out/Module.symvers"

          kernel_release="$(cat "$abi_out/include/config/kernel.release")"
          test "$kernel_release" = "$KERNEL_RELEASE_OVERRIDE"
          echo "Kernel release: $kernel_release"

      - name: Clone and patch module sources
        env:
          MODULE_A_REPO: ${{ inputs.module_a_repo }}
          MODULE_A_BRANCH: ${{ inputs.module_a_branch }}
          MODULE_B_REPO: ${{ inputs.module_b_repo }}
          MODULE_B_BRANCH: ${{ inputs.module_b_branch }}
        run: |
          mkdir -p gki-clo/sources
          git clone --depth=1 --branch "$MODULE_A_BRANCH" "$MODULE_A_REPO" \
            gki-clo/sources/8188eu-a
          git clone --depth=1 --branch "$MODULE_B_BRANCH" "$MODULE_B_REPO" \
            gki-clo/sources/8188eu-b

          # Module A (tdwn tree): the driver Makefile routes its -D flags
          # through ccflags-y only when the BUILD HOST runs >= 6.15 (uname
          # heuristic). The runner kernel is older, so force the same flags
          # the validated on-device build used.
          echo 'ccflags-y += $(EXTRA_CFLAGS)' >> gki-clo/sources/8188eu-a/Makefile

          # Module B (gglluukk tree): add the 0bda:8176 USB ID our dongle
          # reports (upstream table starts at 0x8179).
          sed -i 's|{USB_DEVICE(USB_VENDER_ID_REALTEK, 0x8179), .driver_info = RTL8188E}, /\* 8188EUS \*/|{USB_DEVICE(USB_VENDER_ID_REALTEK, 0x8176), .driver_info = RTL8188E}, /* 8188EU */\n\t{USB_DEVICE(USB_VENDER_ID_REALTEK, 0x8179), .driver_info = RTL8188E}, /* 8188EUS */|' \
            gki-clo/sources/8188eu-b/os_dep/linux/usb_intf.c
          grep -q '0x8176' gki-clo/sources/8188eu-b/os_dep/linux/usb_intf.c || {
            echo "8176 ID patch failed to apply" >&2; exit 1; }
          echo "Module B USB ID table after patch:"
          grep -A2 'CONFIG_RTL8188E' gki-clo/sources/8188eu-b/os_dep/linux/usb_intf.c | head -8

      - name: Build module A (tdwn test18 ablation)
        working-directory: gki-clo
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/neutron-clang/bin:$PATH"
          mkdir -p artifacts
          make -j"$(nproc)" -C sources/xiaomi-kernel O="$PWD/out" \
            M="$PWD/sources/8188eu-a" ARCH=arm64 LLVM=1 \
            CONFIG_RTL8188EU=m CONFIG_RTW_DEBUG=y CONFIG_RTW_LOG_LEVEL=4 \
            USER_EXTRA_CFLAGS="-Wno-error" modules
          cp sources/8188eu-a/8188eu.ko artifacts/8188eu-tdwn-test18-ablation.ko

          strings artifacts/8188eu-tdwn-test18-ablation.ko | \
            grep -q "TEST18" || { echo "Module A missing TEST18 marker" >&2; exit 1; }
          modinfo -F vermagic artifacts/8188eu-tdwn-test18-ablation.ko

      - name: Build module B (gglluukk upstream + 8176)
        working-directory: gki-clo
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/neutron-clang/bin:$PATH"
          make -j"$(nproc)" -C sources/xiaomi-kernel O="$PWD/out" \
            M="$PWD/sources/8188eu-b" ARCH=arm64 LLVM=1 \
            CONFIG_RTL8188EU=m CONFIG_RTW_DEBUG=y CONFIG_RTW_LOG_LEVEL=4 \
            USER_EXTRA_CFLAGS="-Wno-error" modules
          cp sources/8188eu-b/8188eu.ko artifacts/8188eu-gglluukk-8176.ko

          modinfo -F vermagic artifacts/8188eu-gglluukk-8176.ko

      - name: Verify and package
        working-directory: gki-clo
        run: |
          kernel_release="$(cat out/include/config/kernel.release)"
          for m in artifacts/*.ko; do
            vm="$(modinfo -F vermagic "$m")"
            case "$vm" in
              "$kernel_release"*) ;;
              *) echo "Vermagic mismatch for $m: $vm" >&2; exit 1 ;;
            esac
          done
          cat > artifacts/README.txt <<'EOF'
          8188eu freeze-bisect test modules (kernel 6.6.143, onyx)

          A) 8188eu-tdwn-test18-ablation.ko
             Our instrumented tdwn driver with the test18 ablation:
             rtw_dev_remove returns immediately, skipping the ENTIRE
             teardown (netdev + wiphy unregister leak everything).
             Test: otg on -> rmmod 8188eu -> insmod this module.
             Survives = the wedge is in the netdev/wiphy unregister path.
             Still freezes = the wedge is elsewhere (USB layer/hw).

          B) 8188eu-gglluukk-8176.ko
             Independent upstream driver (gglluukk/rtl8188eus@master)
             with only the 0bda:8176 USB ID added. Same test procedure.

          Both built with RTW debug prints at level 4.
          EOF
          (cd artifacts && sha256sum *.ko > SHA256SUMS && zip -r \
            ../8188eu-test-modules-6.6.143.zip .)
          sha256sum 8188eu-test-modules-6.6.143.zip

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-test-modules-6.6.143
          path: |
            gki-clo/8188eu-test-modules-6.6.143.zip
            gki-clo/artifacts/*.ko
            gki-clo/artifacts/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
