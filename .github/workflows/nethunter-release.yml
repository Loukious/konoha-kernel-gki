name: NetHunter Combined Release (kernel + module zips)

# One workflow, one run, one set of artifacts:
#   kernel job  -> builds the kernel, uploads the AK3 zip + its ABI files
#   wlan job    -> needs kernel; builds the WLAN module against THAT
#                  build's ABI (same-run artifact, never a previous run's)
#                  and packages it + external drivers as KSU module zips
#   combine job -> needs both; stages the kernel-only zip, the two
#                  module zips, and the kernel's Module.symvers (for
#                  external-module builds against exactly this kernel,
#                  e.g. the Evolution X onyx ROM's wlan module), and
#                  publishes the release
#
# The WLAN build cannot start before the kernel build: the module is
# compiled against the kernel's Module.symvers/kernel.release/.config.
# Keeping everything in a single run is what makes that dependency cheap —
# no cross-run artifact downloads, nothing to expire.
#
# vendor_dlkm is NOT touched: the injection driver is rmmod'd/insmod'd
# from a KSU module at late_start (validated live on onyx 2026-09-11),
# which makes the kernel flash ROM-agnostic — no partition image to
# write, no size-matching against any ROM's vendor_dlkm.

on:
  workflow_dispatch:
    inputs:
      # ---- kernel build (same meaning as build-custom.yml) ----
      kernel_name:
        description: "Custom Kernel Name (LOCALVERSION)"
        required: true
        type: string
        default: "-Kono-Ha-Kernel"
      spoof_uname:
        description: "Spoof Uname (SUSFS/Stock Naming)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "on"
      hz:
        description: "Refresh Rate (HZ)"
        required: true
        type: choice
        options: [powersave, balance, performance, ultra-performance]
        default: "balance"
      variant:
        description: "Build Variant"
        required: true
        type: choice
        options: [stock, root, susfs]
        default: "root"
      root:
        description: "Root Solution"
        required: true
        type: choice
        options: [ksu-next, ksu, sukisu, yukisu, resukisu, mambosu]
        default: "ksu-next"
      nethunter:
        description: "Kali NetHunter Support"
        required: true
        type: choice
        options: ["off", "on"]
        default: "on"
      lto:
        description: "LTO Type"
        required: true
        type: choice
        options: [thin, none, full]
        default: "thin"
      kpm:
        description: "Kernel Patch Module (KPM)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      nomount:
        description: "NoMount VFS Redirection"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      hardened:
        description: "Hardened Kernel"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      bypasscharging:
        description: "Bypass Charging (MCA Override)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      droidspaces:
        description: "Droidspaces Support"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      htsr:
        description: "HTSR 240Hz Touch Sampling"
        required: true
        type: choice
        options: ["off", "on"]
        default: "on"
      wifi_exploit:
        description: "WiFi Performance Exploits (WLM, Coex, BBR)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "on"
      kgsl_exploit:
        description: "KGSL GPU Bypass (LM_LIMIT, DCVS)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "on"
      data_exploit:
        description: "Mobile Data Exploits (DFC, Powersave)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "on"
      debug:
        description: "Debug Mode (nokaslr, no optimizations)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      # ---- WLAN build ----
      debug_8188eu:
        description: "8188eu debug logging (diagnostic build, do not release)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      publish_release:
        description: "Publish a GitHub release (off = zips stay as private run artifacts only)"
        required: true
        type: choice
        options: ["off", "on"]
        default: "off"
      wlan_branch:
        description: "WLAN source branch for the replacement vendor driver"
        required: true
        type: string
        default: "onyx-v-oss-monitor-direct"
      wlan_repo:
        description: "WLAN source repository"
        required: true
        type: string
        default: "https://github.com/Loukious/vendor_qcom_opensource_wlan.git"
      pixelos_branch:
        description: "PixelOS onyx kernel-module branch"
        required: true
        type: string
        default: "sixteen-qpr2"
      kernel_source_repo:
        description: "Device kernel source used for WLAN ABI headers"
        required: true
        type: string
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
      kernel_source_branch:
        description: "Xiaomi kernel source branch used for WLAN ABI headers"
        required: true
        type: string
        default: "onyx-v-oss"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 8G
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime

permissions:
  contents: write
  actions: read

concurrency:
  group: nethunter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "Guard: kernel-source branch only"
        if: ${{ github.ref_name != 'nethunter-ksunext-upstream' }}
        run: |
          echo "Refused: this workflow checks out the kernel tree from the repo itself," >&2
          echo "so it must run on 'nethunter-ksunext-upstream' (got '${{ github.ref_name }}')." >&2
          echo "Dispatch with: gh workflow run nethunter-release.yml --ref nethunter-ksunext-upstream" >&2
          exit 1

      - name: Parse Inputs
        id: setup_vars
        env:
          INPUT_HZ: ${{ inputs.hz }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_ROOT: ${{ inputs.root }}
          INPUT_NETHUNTER: ${{ inputs.nethunter }}
          INPUT_KPM: ${{ inputs.kpm }}
          INPUT_NOMOUNT: ${{ inputs.nomount }}
          INPUT_HARDENED: ${{ inputs.hardened }}
          INPUT_BYPASS: ${{ inputs.bypasscharging }}
          INPUT_DROIDSPACES: ${{ inputs.droidspaces }}
          INPUT_HTSR: ${{ inputs.htsr }}
          INPUT_WIFI: ${{ inputs.wifi_exploit }}
          INPUT_KGSL: ${{ inputs.kgsl_exploit }}
          INPUT_DATA: ${{ inputs.data_exploit }}
          INPUT_DEBUG: ${{ inputs.debug }}
          INPUT_KERNEL_NAME: ${{ inputs.kernel_name }}
          INPUT_SPOOF_UNAME: ${{ inputs.spoof_uname }}
        run: |
          if [ "$INPUT_HZ" == "powersave" ]; then HZ_ID=100
          elif [ "$INPUT_HZ" == "balance" ]; then HZ_ID=250
          elif [ "$INPUT_HZ" == "performance" ]; then HZ_ID=500
          elif [ "$INPUT_HZ" == "ultra-performance" ]; then HZ_ID=1000
          fi
          echo "HZ_ID=$HZ_ID" >> $GITHUB_ENV

          ACTUAL_ROOT="$INPUT_ROOT"
          if [ "$INPUT_VARIANT" == "stock" ]; then
            ACTUAL_ROOT="none"
          fi
          echo "ACTUAL_ROOT=$ACTUAL_ROOT" >> $GITHUB_ENV

          if [ "$INPUT_VARIANT" == "stock" ]; then
            BUILD_NAME="${INPUT_VARIANT}-${INPUT_HZ}"
          else
            BUILD_NAME="${INPUT_VARIANT}-${ACTUAL_ROOT}-${INPUT_HZ}"
          fi

          if [ "$INPUT_KPM" == "on" ]; then
            BUILD_NAME="${BUILD_NAME}-kpm"
          fi
          if [ "$INPUT_NOMOUNT" == "on" ]; then BUILD_NAME="${BUILD_NAME}-nomount"; fi
          if [ "$INPUT_HARDENED" == "on" ]; then BUILD_NAME="${BUILD_NAME}-hardened"; fi
          if [ "$INPUT_BYPASS" == "on" ]; then BUILD_NAME="${BUILD_NAME}-bypasscharging"; fi
          if [ "$INPUT_DROIDSPACES" == "on" ]; then BUILD_NAME="${BUILD_NAME}-droidspaces"; fi
          if [ "$INPUT_HTSR" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nohtsr"; fi
          if [ "$INPUT_WIFI" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nowifi"; fi
          if [ "$INPUT_KGSL" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nokgsl"; fi
          if [ "$INPUT_DATA" == "off" ]; then BUILD_NAME="${BUILD_NAME}-nodata"; fi
          if [ "$INPUT_DEBUG" == "on" ]; then BUILD_NAME="${BUILD_NAME}-debug"; fi
          if [ "$INPUT_NETHUNTER" == "on" ]; then BUILD_NAME="${BUILD_NAME}-nethunter"; fi

          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV

      - name: Create Swap
        run: |
          SWAPFILE="/mnt/build_swapfile"
          while true; do
            if sudo fallocate -l 10G $SWAPFILE || sudo dd if=/dev/zero of=$SWAPFILE bs=1M count=10240 status=progress; then
              break
            else
              sleep 5
            fi
          done
          sudo chmod 600 $SWAPFILE && sudo mkswap $SWAPFILE && sudo swapon $SWAPFILE

      - uses: actions/checkout@v4
        with:
          path: gki-clo

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 clang lld llvm jq

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.variant }}-${{ inputs.root }}-${{ inputs.hardened }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.variant }}-${{ inputs.root }}-${{ inputs.hardened }}-
            ccache-${{ inputs.variant }}-${{ inputs.root }}-
            ccache-${{ inputs.variant }}-
            ccache-

      - name: Initialize ccache
        run: |
          ccache -z
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -o compiler_check=${{ env.CCACHE_COMPILERCHECK }}
          ccache -o sloppiness=${{ env.CCACHE_SLOPPINESS }}

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b main toolchains/clang

      - name: Setup AnyKernel3
        run: |
          cd gki-clo
          [ ! -d "anykernel" ] && git clone https://github.com/osm0sis/AnyKernel3.git anykernel || true

      - name: Setup NoMount
        if: ${{ inputs.nomount == 'on' }}
        run: |
          echo "Fetching NoMount from maxsteeel repository..."
          git clone --depth=1 https://github.com/maxsteeel/nomount.git /tmp/nomount
          cd gki-clo

          KERNEL_VERSION=$(grep -E '^(VERSION|PATCHLEVEL)\s*=' Makefile | awk -F'=' '{print $2}' | tr -d ' ' | paste -sd '.' -)
          echo "Detected kernel version: $KERNEL_VERSION"

          PATCH_FILE=$(find /tmp/nomount -type f -name "nomount_${KERNEL_VERSION}*.patch" | head -n 1)

          if [ -f "$PATCH_FILE" ]; then
            echo "Applying NoMount patch: $PATCH_FILE"
            patch -p1 < "$PATCH_FILE"

            cp -r /tmp/nomount/kernel/src/* fs/
          else
            echo "Warning: NoMount patch for $KERNEL_VERSION not found in the repository!"
            exit 1
          fi

      - name: Build Kernel
        env:
          KPM_SUPERKEY_SECRET: ${{ secrets.KPM_SUPERKEY }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_NETHUNTER: ${{ inputs.nethunter }}
          INPUT_LTO: ${{ inputs.lto }}
          INPUT_KPM: ${{ inputs.kpm }}
          INPUT_HARDENED: ${{ inputs.hardened }}
          INPUT_HTSR: ${{ inputs.htsr }}
          INPUT_WIFI: ${{ inputs.wifi_exploit }}
          INPUT_KGSL: ${{ inputs.kgsl_exploit }}
          INPUT_DATA: ${{ inputs.data_exploit }}
          INPUT_BYPASS: ${{ inputs.bypasscharging }}
          INPUT_DROIDSPACES: ${{ inputs.droidspaces }}
          INPUT_DEBUG: ${{ inputs.debug }}
          INPUT_KERNEL_NAME: ${{ inputs.kernel_name }}
          INPUT_SPOOF_UNAME: ${{ inputs.spoof_uname }}
        run: |
          # Wrap compiler with ccache
          export PATH="/usr/lib/ccache:$PATH"

          cd gki-clo
          chmod +x build.sh

          KPM_PATCH="on"
          if [ "$INPUT_KPM" == "on" ] && [ "$ACTUAL_ROOT" == "resukisu" ]; then
            KPM_PATCH="off"
          fi

          LTO_VAL="$INPUT_LTO"
          if [ "$INPUT_KPM" == "on" ]; then
            LTO_VAL="thin"
          fi

          KPM_KEY=""
          if [ "$INPUT_KPM" == "on" ]; then
            KPM_KEY="$KPM_SUPERKEY_SECRET"
          fi

          ./build.sh \
            hz="$HZ_ID" \
            variant="$INPUT_VARIANT" \
            root="$ACTUAL_ROOT" \
            kpm="$INPUT_KPM" \
            kpm_superkey="$KPM_KEY" \
            kpm_patch="$KPM_PATCH" \
            hardened="$INPUT_HARDENED" \
            bypasscharging="$INPUT_BYPASS" \
            droidspaces="$INPUT_DROIDSPACES" \
            nethunter="$INPUT_NETHUNTER" \
            htsr="$INPUT_HTSR" \
            wifi_exploit="$INPUT_WIFI" \
            kgsl_exploit="$INPUT_KGSL" \
            data_exploit="$INPUT_DATA" \
            debug="$INPUT_DEBUG" \
            kernel_name="$INPUT_KERNEL_NAME" \
            spoof_uname="$INPUT_SPOOF_UNAME" \
            lto="$LTO_VAL"

      - name: Show ccache stats
        if: always()
        run: ccache -s

      # ABI fingerprint of THIS build, consumed by the wlan job in the same
      # run so the replacement WLAN module always matches the kernel it
      # will ship with.
      - name: Collect kernel ABI files
        run: |
          mkdir -p gki-clo/kernel-abi
          cp gki-clo/out/Module.symvers gki-clo/kernel-abi/
          cp gki-clo/out/.config gki-clo/kernel-abi/kernel.config
          cp gki-clo/out/include/config/kernel.release gki-clo/kernel-abi/kernel.release
          sha256sum gki-clo/kernel-abi/Module.symvers > gki-clo/kernel-abi/Module.symvers.sha256
          echo "kernel release: $(cat gki-clo/kernel-abi/kernel.release)"

      - name: Upload kernel ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-abi
          path: gki-clo/kernel-abi
          retention-days: 14

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Kono-Ha-${{ env.BUILD_NAME }}
          path: gki-clo/Kono-Ha-Release
          retention-days: 7

  wlan:
    name: Build WLAN module and package KSU module zips
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          path: gki-clo

      - name: Install module and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils bc bison build-essential ccache curl \
            clang erofs-utils fakeroot flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick jq kmod lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lld llvm lzop pngcrush python3 rsync schedtool \
            squashfs-tools wget xsltproc zip zlib1g-dev zstd

      - name: Create module-build swap
        run: |
          sudo fallocate -l 6G /mnt/wlan_swapfile
          sudo chmod 600 /mnt/wlan_swapfile
          sudo mkswap /mnt/wlan_swapfile
          sudo swapon /mnt/wlan_swapfile

      - name: Setup WLAN ccache
        # The qcacld/platform/8188eu compiles are pure .c -> .o work keyed by
        # source + flags; the same-run Module.symvers only feeds modpost, not
        # compilation, so entries stay valid across runs. The kernel job has
        # run at 99.9% hit rate with the same settings; expected saving here
        # is ~4-5 of the ~6 minutes the qcacld build takes.
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wlan-${{ inputs.wlan_branch }}-${{ inputs.kernel_source_branch }}-${{ github.sha }}
          restore-keys: |
            ccache-wlan-${{ inputs.wlan_branch }}-${{ inputs.kernel_source_branch }}-
            ccache-wlan-${{ inputs.wlan_branch }}-
            ccache-wlan-

      - name: Initialize WLAN ccache
        run: |
          ccache -z
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -o compiler_check=${{ env.CCACHE_COMPILERCHECK }}
          ccache -o sloppiness=${{ env.CCACHE_SLOPPINESS }}

      - name: Download Neutron Clang Toolchain
        run: |
          mkdir -p toolchains/neutron-clang
          cd toolchains/neutron-clang
          bash <(curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") \
            -S=10032024 --noconfirm --noprogress --noaxel
          bash <(curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") \
            --patch=glibc --noconfirm --noprogress --noaxel
          bin/clang --version

      - name: Download kernel ABI from the kernel job
        uses: actions/download-artifact@v4
        with:
          name: kernel-abi
          path: gki-clo/sources/kernel-abi

      - name: Clone WLAN and PixelOS inputs
        env:
          KERNEL_SOURCE_BRANCH: ${{ inputs.kernel_source_branch }}
          KERNEL_SOURCE_REPO: ${{ inputs.kernel_source_repo }}
          PIXELOS_BRANCH: ${{ inputs.pixelos_branch }}
          WLAN_BRANCH: ${{ inputs.wlan_branch }}
          WLAN_REPO: ${{ inputs.wlan_repo }}
        run: |
          mkdir -p gki-clo/vendor/qcom/opensource gki-clo/sources/pixelos
          git clone --depth=1 --filter=blob:none --single-branch \
            --branch "$KERNEL_SOURCE_BRANCH" "$KERNEL_SOURCE_REPO" \
            gki-clo/sources/xiaomi-kernel
          git clone --depth=1 --branch "$WLAN_BRANCH" \
            "$WLAN_REPO" \
            gki-clo/vendor/qcom/opensource/wlan
          git clone --depth=1 --branch "$PIXELOS_BRANCH" \
            https://github.com/PixelOS-Devices/android_device_xiaomi_onyx-kernel.git \
            gki-clo/sources/pixelos/android_device_xiaomi_onyx-kernel
          git clone --depth=1 https://android.googlesource.com/platform/external/avb \
            gki-clo/sources/avb

          wlan_version="$(sed -n 's/.*QWLAN_VERSIONSTR[[:space:]]*"\([^"]*\)".*/\1/p' \
            gki-clo/vendor/qcom/opensource/wlan/qcacld-3.0/core/mac/inc/qwlan_version.h)"
          kernel_device="${KERNEL_SOURCE_BRANCH%%-*}"
          echo "WLAN source: $WLAN_REPO@$WLAN_BRANCH"
          echo "WLAN source version: $wlan_version"
          echo "Kernel source device config: $kernel_device"
          test -n "$wlan_version"
          test -f "gki-clo/sources/xiaomi-kernel/build.config.msm.$kernel_device"
          test -f "gki-clo/sources/xiaomi-kernel/include/linux/qcom-iommu-util.h"
          test -f "gki-clo/sources/xiaomi-kernel/kernel/sched/walt/walt.c"

      - name: Install kernel symbols and stock vendor_dlkm template
        env:
          STOCK_SHA256: 897334474453521b50f31c76df095a363be97bd3f66d1f1943ede391768a186a
        run: |
          mkdir -p gki-clo/out
          # Symbols straight from the kernel job of THIS run.
          test -f gki-clo/sources/kernel-abi/Module.symvers
          test -f gki-clo/sources/kernel-abi/kernel.release
          cp gki-clo/sources/kernel-abi/Module.symvers gki-clo/out/Module.symvers
          want="$(awk '{print $1}' gki-clo/sources/kernel-abi/Module.symvers.sha256)"
          got="$(sha256sum gki-clo/out/Module.symvers | awk '{print $1}')"
          [[ "$got" == "$want" ]] || { echo "Module.symvers checksum mismatch ($got != $want)" >&2; exit 1; }
          echo "Using Module.symvers from the kernel job of this run"

          # Template ships with the repo (vendor_dlkm-templates/): it must be
          # from the ROM family the device runs — a PixelOS-built image
          # bootlooped an Evolution X install on 2026-08-30. See its README.
          cp gki-clo/vendor_dlkm-templates/vendor_dlkm-evolution-20260828.img \
            gki-clo/sources/pixelos/vendor_dlkm-stock.img
          echo "$STOCK_SHA256  gki-clo/sources/pixelos/vendor_dlkm-stock.img" | sha256sum -c -

      - name: Apply WCN7750 packet-injection port
        working-directory: gki-clo/vendor/qcom/opensource/wlan
        run: |
          if grep -q 'hdd_monitor_mode_tx_inject' \
               qcacld-3.0/core/hdd/src/wlan_hdd_tx_rx.c &&
             grep -qx 'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y' \
               qcacld-3.0/configs/sun_gki_wcn7750_defconfig; then
            echo "Packet injection is already integrated in the WLAN source."
          else
            patch="$GITHUB_WORKSPACE/gki-clo/docs/nethunter/wcn7750-6.6-packet-injection.patch"
            git apply --check "$patch"
            git apply "$patch"
          fi
          git diff --check

      - name: Prepare Xiaomi Onyx kernel ABI headers
        working-directory: gki-clo
        env:
          KERNEL_SOURCE_BRANCH: ${{ inputs.kernel_source_branch }}
        run: |
          # /usr/lib/ccache first: "clang" resolves to the ccache shim, which
          # finds the real (neutron) clang further down PATH.
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/toolchains/neutron-clang/bin:$PATH"
          clang --version

          KERNEL_RELEASE_OVERRIDE="$(cat sources/kernel-abi/kernel.release)"
          echo "Kernel release taken from the kernel job: $KERNEL_RELEASE_OVERRIDE"

          abi_src="$GITHUB_WORKSPACE/gki-clo/sources/xiaomi-kernel"
          abi_out="$GITHUB_WORKSPACE/gki-clo/out"
          saved_symvers="$RUNNER_TEMP/wlan-Module.symvers"
          kernel_device="${KERNEL_SOURCE_BRANCH%%-*}"
          vendor_perf_config="$abi_src/arch/arm64/configs/vendor/${kernel_device}_perf.config"
          kernel_localversion="-android15-8-4k"

          cp "$abi_out/Module.symvers" "$saved_symvers"
          mkdir -p "$abi_out"
          if [[ -n "$KERNEL_RELEASE_OVERRIDE" ]]; then
            base_version="${KERNEL_RELEASE_OVERRIDE%%-*}"
            if [[ "$KERNEL_RELEASE_OVERRIDE" == *-* ]]; then
              kernel_localversion="-${KERNEL_RELEASE_OVERRIDE#*-}"
            else
              kernel_localversion=""
            fi
            IFS=. read -r kernel_version kernel_patchlevel kernel_sublevel <<< "$base_version"
            if [[ -z "${kernel_version:-}" || -z "${kernel_patchlevel:-}" || -z "${kernel_sublevel:-}" ]]; then
              echo "Invalid kernel release: $KERNEL_RELEASE_OVERRIDE" >&2
              exit 1
            fi
            KERNEL_VERSION="$kernel_version" \
              KERNEL_PATCHLEVEL="$kernel_patchlevel" \
              KERNEL_SUBLEVEL="$kernel_sublevel" \
              perl -0pi -e '
                s/^VERSION = .*/VERSION = $ENV{KERNEL_VERSION}/m;
                s/^PATCHLEVEL = .*/PATCHLEVEL = $ENV{KERNEL_PATCHLEVEL}/m;
                s/^SUBLEVEL = .*/SUBLEVEL = $ENV{KERNEL_SUBLEVEL}/m;
              ' "$abi_src/Makefile"
          fi
          install -D -m 0644 \
            tools/xiaomi-source-stubs/drivers/misc/hwid/Kconfig \
            "$abi_src/drivers/misc/hwid/Kconfig"
          install -D -m 0644 \
            tools/xiaomi-source-stubs/include/hwid.h \
            "$abi_src/include/hwid.h"
          rm -rf "$abi_src/drivers/power/supply/mca"
          install -D -m 0644 \
            tools/xiaomi-source-stubs/drivers/power/supply/mca/Kconfig \
            "$abi_src/drivers/power/supply/mca/Kconfig"
          if [[ ! -f "$vendor_perf_config" ]]; then
            echo "Missing vendor perf config: $vendor_perf_config" >&2
            find "$abi_src/arch/arm64/configs/vendor" -maxdepth 1 -name '*_perf.config' -printf '%f\n' | sort >&2
            exit 1
          fi
          KCONFIG_CONFIG="$abi_out/.config" \
            "$abi_src/scripts/kconfig/merge_config.sh" -m -r -y \
            "$abi_src/arch/arm64/configs/gki_defconfig" \
            "$abi_src/arch/arm64/configs/vendor/sun_perf.config" \
            "$vendor_perf_config"
          "$abi_src/scripts/config" --file "$abi_out/.config" \
            --set-str LOCALVERSION "$kernel_localversion" \
            --disable LOCALVERSION_AUTO \
            --disable KUNIT
          make -j"$(nproc)" -C "$abi_src" O="$abi_out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION= \
            olddefconfig prepare modules_prepare
          cp "$saved_symvers" "$abi_out/Module.symvers"

          grep -qx '# CONFIG_KUNIT is not set' "$abi_out/.config"
          kernel_release="$(cat "$abi_out/include/config/kernel.release")"
          test "$kernel_release" = "$KERNEL_RELEASE_OVERRIDE"

          # Vermagic is UTS_RELEASE plus the SMP/preempt/module flags. The
          # kernel job's config is available, so require agreement on every
          # flag that feeds VERMAGIC_STRING — otherwise the module could
          # pass the release check and still be rejected at load time.
          for key in CONFIG_SMP CONFIG_PREEMPT CONFIG_PREEMPT_VOLUNTARY \
                     CONFIG_PREEMPT_NONE CONFIG_PREEMPT_DYNAMIC \
                     CONFIG_PREEMPT_LL CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD; do
            kernel_val="$(grep -E "^$key=|^# $key is not set" \
              "$GITHUB_WORKSPACE/gki-clo/sources/kernel-abi/kernel.config" | head -1)"
            abi_val="$(grep -E "^$key=|^# $key is not set" "$abi_out/.config" | head -1)"
            if [[ "$kernel_val" != "$abi_val" ]]; then
              echo "Vermagic-affecting config differs for $key:" >&2
              echo "  kernel build:  ${kernel_val:-unset}" >&2
              echo "  wlan ABI prep: ${abi_val:-unset}" >&2
              exit 1
            fi
          done
          echo "WLAN_KERNEL_SRC=$abi_src" >> "$GITHUB_ENV"
          echo "WLAN_KERNEL_OUT=$abi_out" >> "$GITHUB_ENV"
          echo "Xiaomi source branch: $KERNEL_SOURCE_BRANCH"
          echo "Xiaomi source commit: $(git -C "$abi_src" rev-parse HEAD)"
          echo "Xiaomi vendor perf config: $(basename "$vendor_perf_config")"
          echo "Kernel release: $kernel_release"

      - name: Build WLAN module
        working-directory: gki-clo
        env:
          CC: clang
          KERNEL_SRC: ${{ env.WLAN_KERNEL_SRC }}
          KERNEL_OUT: ${{ env.WLAN_KERNEL_OUT }}
          WLAN_BRANCH: ${{ inputs.wlan_branch }}
          KERNEL_SOURCE_BRANCH: ${{ inputs.kernel_source_branch }}
          WLAN_EXTRA_KCFLAGS: ""
        run: |
          # ccache shim first, real clang second (see ABI-headers step).
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/toolchains/neutron-clang/bin:$PATH"
          clang --version

          chmod +x tools/*.sh
          tools/make_pixelos_wlan_symvers.sh

          if grep -q 'hdd_monitor_mode_tx_inject' \
               vendor/qcom/opensource/wlan/qcacld-3.0/core/hdd/src/wlan_hdd_tx_rx.c &&
             grep -qx 'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y' \
               vendor/qcom/opensource/wlan/qcacld-3.0/configs/sun_gki_wcn7750_defconfig; then
            effective_injection=true
          else
            effective_injection=false
          fi
          if [[ "$effective_injection" != "true" ]]; then
            echo "Injection port did not land on this WLAN branch" >&2
            exit 1
          fi

          mode="injection-${WLAN_BRANCH}-${KERNEL_SOURCE_BRANCH}"
          module="artifacts/wlan/qca_cld3_wcn7750-konoha-${mode}.ko"
          REQUIRE_INJECTION="$effective_injection" \
            tools/build_wlan_injection_module.sh "$module"

          echo "WLAN_MODE=$mode" >> "$GITHUB_ENV"
          echo "WLAN_MODULE=$module" >> "$GITHUB_ENV"
          kernel_release="$(cat "$KERNEL_OUT/include/config/kernel.release")"
          module_vermagic="$(modinfo -F vermagic "$module")"
          mkdir -p artifacts/wlan
          nm -S --defined-only "$module" 2>/dev/null | tee artifacts/wlan/qca_cld3_wcn7750.defined-symbols.txt >/dev/null
          readelf -sW "$module" > artifacts/wlan/qca_cld3_wcn7750.readelf-symbols.txt

          case "$module_vermagic" in
            "$kernel_release"*) ;;
            *)
              echo "WLAN module vermagic does not match the prepared kernel" >&2
              echo "  kernel release:  $kernel_release" >&2
              echo "  module vermagic: $module_vermagic" >&2
              exit 1
              ;;
          esac
          if ! grep -a -q hdd_monitor_mode_tx_inject "$module"; then
            echo "Injection module is missing hdd_monitor_mode_tx_inject" >&2
            exit 1
          fi
          if ! grep -a -q qcwlanstate "$module"; then
            echo "WLAN module is missing qcwlanstate" >&2
            exit 1
          fi

          stock_module=sources/pixelos/android_device_xiaomi_onyx-kernel/modules/vendor_dlkm/qca_cld3_wcn7750.ko
          stock_ops_size="$(readelf -sW "$stock_module" | awk '$8 == "wlan_hdd_cfg80211_ops" { print $3; exit }')"
          module_ops_size="$(readelf -sW "$module" | awk '$8 == "wlan_hdd_cfg80211_ops" { print $3; exit }')"
          if [[ -z "$stock_ops_size" ]]; then
            echo "Could not read wlan_hdd_cfg80211_ops size from PixelOS stock module" >&2
            exit 1
          fi
          if [[ -z "$module_ops_size" ]]; then
            echo "Could not read wlan_hdd_cfg80211_ops size from rebuilt module" >&2
            exit 1
          fi
          if [[ "$module_ops_size" != "$stock_ops_size" ]]; then
            echo "wlan_hdd_cfg80211_ops size mismatch" >&2
            echo "  rebuilt: $module_ops_size bytes" >&2
            echo "  stock:   $stock_ops_size bytes" >&2
            exit 1
          fi
          stock_drv_ops_size="$(readelf -sW "$stock_module" | awk '$5 == "GLOBAL" && $8 == "wlan_drv_ops" { print $3; exit }')"
          module_drv_ops_size="$(readelf -sW "$module" | awk '$5 == "GLOBAL" && $8 == "wlan_drv_ops" { print $3; exit }')"
          if [[ -z "$stock_drv_ops_size" || -z "$module_drv_ops_size" ]]; then
            echo "Could not read wlan_drv_ops size for stock or rebuilt module" >&2
            exit 1
          fi
          if [[ "$module_drv_ops_size" != "$stock_drv_ops_size" ]]; then
            echo "wlan_drv_ops size mismatch" >&2
            echo "  rebuilt: $module_drv_ops_size bytes" >&2
            echo "  stock:   $stock_drv_ops_size bytes" >&2
            exit 1
          fi

          echo "kernel release:  $kernel_release"
          echo "module vermagic: $module_vermagic"
          echo "cfg80211_ops:    $module_ops_size bytes (PixelOS stock: $stock_ops_size)"

      - name: Build extra kernel modules (KSU module zip)
        working-directory: gki-clo
        env:
          KERNEL_SRC: ${{ env.WLAN_KERNEL_SRC }}
          KERNEL_OUT: ${{ env.WLAN_KERNEL_OUT }}
          github_run_number: ${{ github.run_number }}
          # The build script treats anything other than on/1/y as off.
          RTW_DEBUG: ${{ inputs.debug_8188eu }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/toolchains/neutron-clang/bin:$PATH"
          clang --version

          # External-adapter drivers ship as a KernelSU module instead of
          # vendor_dlkm: the partition has ~370KB of slack, which no Realtek
          # USB driver fits into, and a KSU module works on any ROM regardless
          # of vendor_dlkm size. insmod from service.sh is validated on device.
          # The konoha fork carries the STA-ALIGN8 freeze fix and the GKI
          # namespace import baked in; the build script asserts both instead
          # of patching.
          git clone --depth=1 -b konoha https://github.com/Loukious/rtl8188eus.git \
            sources/rtl8188eus
          echo "rtl8188eus (konoha fork) commit: $(git -C sources/rtl8188eus rev-parse HEAD)"

          chmod +x tools/*.sh
          tools/build_rtl8188eus_module.sh artifacts/wlan/8188eu.ko

          # rtl8xxxu (in-tree source, built from the ABI tree) covers the
          # Realtek dongles the 8188eu vendor driver does not: RTL8188CU/
          # 8192CU (0bda:8176 - a DIFFERENT chip family from 8188EU/8179),
          # 8188FU, 8192EU/FU, 8723AU/BU, 8710BU. Device-validated on onyx
          # 2026-09-14 (RTL8188CU dongle: probe, firmware, scan, clean
          # teardown). The build script asserts the ieee80211_ops layout
          # the ROM vendor mac80211 module expects.
          tools/build_rtl8xxxu_module.sh artifacts/wlan/rtl8xxxu.ko

          kernel_release="$(cat "$KERNEL_OUT/include/config/kernel.release")"
          version_code="$((github_run_number + 100))"
          # A debug module keeps the same module id so it upgrades the release
          # in place, but is labelled so it can never be mistaken for one.
          name_suffix=""
          version_suffix=""
          desc_prefix=""
          if [[ "${RTW_DEBUG:-off}" == "on" ]]; then
            name_suffix=" (DEBUG LOGGING)"
            version_suffix="-debug"
            desc_prefix="DIAGNOSTIC BUILD - verbose driver logging compiled in (noisy dmesg, for freeze diagnosis only; replace with a release build afterwards). "
          fi
          tools/make_ksu_module_zip.sh \
            --out "artifacts/extra-modules/nethunter-extra-modules-${kernel_release}${version_suffix}.zip" \
            --module-name "NetHunter Extra Kernel Modules${name_suffix}" \
            --module-id nethunter-extra-modules \
            --version "v${kernel_release}.${version_code}${version_suffix}" \
            --versionCode "$version_code" \
            --description "${desc_prefix}Extra out-of-tree kernel modules for kernel release ${kernel_release}: RTL8188EUS USB adapter (monitor mode + frame injection) and rtl8xxxu (RTL8188CU/8192CU and other Realtek USB adapters). Install via KernelSU/Magisk manager; modules load from service.sh." \
            --fw tools/firmware \
            --ko 8188eu=artifacts/wlan/8188eu.ko \
            --dep 8188eu=cfg80211 \
            --ko rtl8xxxu=artifacts/wlan/rtl8xxxu.ko \
            --dep rtl8xxxu=cfg80211,mac80211

      - name: Package WLAN injection driver as KSU module zip
        # The injection qca_cld3 ships as a KernelSU/Magisk module that
        # rmmod's the ROM's stock driver and insmods ours at late_start
        # (swap validated live on onyx 2026-09-11: clean rmmod/insmod,
        # full Wi-Fi reconnect, monitor + injection working after swap).
        # This makes the kernel ROM-agnostic: no vendor_dlkm flash and no
        # partition-size requirement; any ROM with a stock qca_cld3_wcn7750
        # vendor_dlkm gets the injection driver through the module.
        working-directory: gki-clo
        env:
          WLAN_MODULE: ${{ env.WLAN_MODULE }}
          WLAN_KERNEL_OUT: ${{ env.WLAN_KERNEL_OUT }}
          github_run_number: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x tools/*.sh
          kernel_release="$(cat "$WLAN_KERNEL_OUT/include/config/kernel.release")"
          version_code="$((github_run_number + 100))"
          tools/make_ksu_module_zip.sh \
            --out "artifacts/wlan-ksm/nethunter-wlan-injection-${kernel_release}.zip" \
            --module-name "NetHunter WLAN Injection (internal Wi-Fi)" \
            --module-id nethunter-wlan-injection \
            --version "v${kernel_release}.${version_code}" \
            --versionCode "$version_code" \
            --description "Internal Wi-Fi driver (qca_cld3_wcn7750) rebuilt for this kernel with monitor mode + frame injection. Replaces the stock driver at boot via rmmod/insmod. Works on any ROM running the matching kernel - no vendor_dlkm flash required." \
            --swap qca_cld3_wcn7750="$WLAN_MODULE" \
            --dep qca_cld3_wcn7750=cfg80211
          # Sanity: the injection marker must be inside the packaged module.
          unzip -p "artifacts/wlan-ksm/nethunter-wlan-injection-${kernel_release}.zip" \
            "system/lib/modules/${kernel_release}/qca_cld3_wcn7750.ko" > /tmp/packed.ko
          cmp "$WLAN_MODULE" /tmp/packed.ko
          grep -a -q hdd_monitor_mode_tx_inject /tmp/packed.ko
          sha256sum "$WLAN_MODULE" | tee artifacts/SHA256SUMS

      - name: Upload failed WLAN debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-wlan-debug-${{ github.run_id }}
          path: |
            gki-clo/artifacts/wlan/*
            gki-clo/vendor/qcom/opensource/wlan/qcacld-3.0/Module.symvers
            gki-clo/vendor/qcom/opensource/wlan/qcacld-3.0/qca_cld3_wcn7750.ko
          retention-days: 7
          if-no-files-found: warn

      - name: Upload WLAN injection KSU zip
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-wlan-injection
          # Single path on purpose: with two paths upload-artifact keeps the
          # least-common-ancestor prefix, which would nest the zip one
          # directory deeper on download.
          path: gki-clo/artifacts/wlan-ksm/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload extra-modules KSU zip
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-extra-modules
          path: |
            gki-clo/artifacts/extra-modules/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Show WLAN ccache stats
        if: always()
        run: ccache -s

  combine-release:
    name: Combine into release zips and publish
    needs: [kernel, wlan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download kernel zip from the kernel job
        uses: actions/download-artifact@v4
        with:
          pattern: "Kono-Ha-*"
          path: kernel-build
          merge-multiple: true

      - name: Download WLAN injection KSU zip from the WLAN job
        uses: actions/download-artifact@v4
        with:
          name: nethunter-wlan-injection
          path: wlan-ksm

      - name: Download extra-modules KSU zip from the WLAN job
        uses: actions/download-artifact@v4
        with:
          name: nethunter-extra-modules
          path: extra-modules

      - name: Download kernel ABI for the release string
        uses: actions/download-artifact@v4
        with:
          name: kernel-abi
          path: kernel-abi

      - name: Stage release zips
        env:
          KERNEL_RELEASE_FILE: kernel-abi/kernel.release
        run: |
          set -euo pipefail
          KERNEL_RELEASE="$(cat "$KERNEL_RELEASE_FILE")"
          [[ -n "$KERNEL_RELEASE" ]] || { echo "kernel.release is empty" >&2; exit 1; }
          kernel_zip="$(find kernel-build -maxdepth 2 -name 'Kono-Ha-*.zip' | head -1)"
          [[ -n "$kernel_zip" ]] || { echo "kernel zip not found in kernel-build/" >&2; exit 1; }

          echo "kernel zip:     $kernel_zip"
          echo "kernel release: $KERNEL_RELEASE"

          # Deliverable 1: the kernel itself, AnyKernel3 flashable, ROM-agnostic.
          mkdir -p release
          cp "$kernel_zip" "release/$(basename "${kernel_zip%.zip}")-kernel-only.zip"

          # Deliverables 2 & 3: KSU modules built in this run against this
          # kernel's ABI (internal Wi-Fi injection driver + external USB
          # adapter drivers). Installed from the KernelSU/Magisk manager.
          cp wlan-ksm/*.zip release/
          cp extra-modules/*.zip release/
          ls wlan-ksm/ extra-modules/ >/dev/null

          # Deliverable 4: this build's Module.symvers, so the ROM build can
          # compile its wlan module against exactly this kernel (SYMVERS_URL
          # in konoha-abi-prep.sh points at the release asset). The
          # kernel-abi artifact's own .sha256 records its tree-relative path;
          # regenerate with the bare name so `sha256sum -c` works in-place
          # for consumers that download both files into one directory.
          (cd kernel-abi && sha256sum Module.symvers > Module.symvers.sha256)
          mkdir -p release-abi
          cp kernel-abi/Module.symvers kernel-abi/Module.symvers.sha256 release-abi/

          (cd release && sha256sum ./* | tee SHA256SUMS)
          ls -lh release/ release-abi/
          echo "kernel_release=$KERNEL_RELEASE" >> "$GITHUB_OUTPUT"
        id: combine

      - name: Create Release
        # Off by default: the zips are always uploaded as run artifacts, so
        # test runs stay private. Flip publish_release=on for a real release
        # only after the module has been device-tested.
        if: inputs.publish_release == 'on'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nethunter-${{ steps.combine.outputs.kernel_release }}-${{ github.run_number }}
          name: NetHunter Combined ${{ steps.combine.outputs.kernel_release }}
          body: |
            Four deliverables, all built in one run against the same ABI:

            1. **`*-kernel-only.zip`** — flash from recovery (AnyKernel3).
               The kernel only: no vendor_dlkm write, no partition-size
               requirement, works on any ROM.
            2. **`nethunter-wlan-injection-*.zip`** — KernelSU/Magisk module
               with the internal Wi-Fi driver (qca_cld3_wcn7750) rebuilt
               with monitor mode + frame injection. It swaps the ROM's stock
               driver at boot (rmmod + insmod). Install after flashing the
               kernel; keep the ROM's own vendor_dlkm.
            3. **`nethunter-extra-modules-*.zip`** — KernelSU/Magisk module
               with external USB adapter drivers (currently RTL8188EUS:
               monitor mode + frame injection).

            4. **`Module.symvers`** (+ `.sha256`) — the kernel's symbol
               table, for building external modules against exactly this
               kernel (used by the Evolution X onyx ROM build).

            Install order: flash zip 1 from recovery, then install zips 2
            and 3 from the KernelSU/Magisk manager, then reboot.

            - Kernel release: `${{ steps.combine.outputs.kernel_release }}`
            - Kernel config: HZ **${{ inputs.hz }}**, root **${{ inputs.root }}**,
              NetHunter **${{ inputs.nethunter }}**, LTO **${{ inputs.lto }}**,
              bypass charging **${{ inputs.bypasscharging }}**
            - WLAN source: ${{ inputs.wlan_repo }}@${{ inputs.wlan_branch }}
            - Built entirely in run ${{ github.run_id }} (kernel, WLAN and
              modules from the same artifacts)
          prerelease: true
          files: |
            release/*
            release-abi/Module.symvers
            release-abi/Module.symvers.sha256
